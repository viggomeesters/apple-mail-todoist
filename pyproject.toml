[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "apple-mail-todoist"
version = "0.1.0"
description = "Create actionable Todoist tasks from selected Apple Mail messages on macOS."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Viggo Meesters" }]
keywords = ["apple-mail", "todoist", "raycast", "macos", "automation"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: MacOS X",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/viggomeesters/apple-mail-todoist"
Issues = "https://github.com/viggomeesters/apple-mail-todoist/issues"
Repository = "https://github.com/viggomeesters/apple-mail-todoist"

[dependency-groups]
dev = [
  "jsonschema>=4.23,<5",
  "pytest>=8.2,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/apple_mail_todoist"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
